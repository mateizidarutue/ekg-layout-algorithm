neo4j:
  uri: neo4j://127.0.0.1:7687
  user: neo4j
  # Password is resolved from the NEO4J_PASSWORD environment variable.
  # For local dev convenience you may set a literal fallback below, but DO NOT
  # commit a real password to version control.
  password: ${NEO4J_PASSWORD}
  default_database: bep_eval

datasets:
  library:
    raw_data: data/raw/library.xes
    semantic_header: data/semantic_headers/library.json
    dataset_description: data/semantic_headers/library_DS.json
    database: library

  bpic19:
    raw_data: data/raw/bpic19/
    semantic_header: data/semantic_headers/bpic19.json
    dataset_description: data/semantic_headers/bpic19_DS.json
    database: bpic19

  bpic17:
    raw_data: data/raw/bpic17/
    semantic_header: data/semantic_headers/BPIC17.json
    dataset_description: data/semantic_headers/BPIC17_DS.json
    database: bpic17
